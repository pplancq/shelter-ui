name: Release

on:
  workflow_dispatch:
    inputs:
      releaseType:
        description: Release type
        required: true
        type: choice
        default: stable
        options:
          - stable
          - alpha
          - beta
          - rc
      dryRun:
        description: Dry run
        required: false
        type: boolean
        default: false
      debug:
        description: Debug mode
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' && github.actor == 'pplancq'
    name: Release
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: pplancq/actions/setup-node@66e6d183d1cb9c8f9a4bd1a347c13bca6025ba6a # v1.1.3
        with:
          use-mise: "true"

      - name: Install package
        run: npm ci

      - name: Run build
        run: npm run build

      - name: Config npm
        run: |
          npm config set access=public
          npm config set provenance=true

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_EMAIL: release[bot]@users.noreply.github.com
          GIT_AUTHOR_NAME: release[bot]
          GIT_COMMITTER_EMAIL: release[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: release[bot]
        run: |
          RELEASE_TYPE="${{ github.event.inputs.releaseType }}"
          ARGS=("--yes")
          export NPM_CONFIG_TAG=latest

          if [ "$RELEASE_TYPE" != "stable" ]; then
            ARGS=("prerelease" "${ARGS[@]}")
            ARGS+=("--preid" "$RELEASE_TYPE")
            export NPM_CONFIG_TAG="$RELEASE_TYPE"
          fi

          if [ "${{ github.event.inputs.dryRun }}" = "true" ]; then
            ARGS+=("--dry-run")
          fi

          if [ "${{ github.event.inputs.debug }}" = "true" ]; then
            ARGS+=("--verbose")
          fi

          npx nx release "${ARGS[@]}"

  deploy:
    if: ${{ !github.event.inputs.dryRun }}
    needs:
      - release
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: pplancq/actions/setup-node@66e6d183d1cb9c8f9a4bd1a347c13bca6025ba6a # v1.1.3
        with:
          use-mise: "true"

      - name: Run build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: apps/storybook/build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
