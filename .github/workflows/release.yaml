name: Release

on:
  workflow_dispatch:
    inputs:
      releaseType:
        description: Release type
        required: true
        type: choice
        default: stable
        options:
          - stable
          - alpha
          - beta
          - rc
      dryRun:
        description: Dry run
        required: false
        type: boolean
        default: false
      debug:
        description: Debug mode
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' && github.actor == 'pplancq'
    name: Release
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Release
        uses: pplancq/actions/nx-release@72cc7f266d747ce0558318611cf11857c894e6ff # v1.1.4
        with:
          release-type: ${{ github.event.inputs.releaseType }}
          dry-run: ${{ github.event.inputs.dryRun }}
          debug: ${{ github.event.inputs.debug }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    if: ${{ !github.event.inputs.dryRun }}
    needs:
      - release
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: pplancq/actions/setup-node@72cc7f266d747ce0558318611cf11857c894e6ff # v1.1.4
        with:
          use-mise: "true"

      - name: Install package
        run: npm ci --ignore-scripts

      - name: Run build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: apps/storybook/build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
