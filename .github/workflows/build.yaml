name: Build

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

env:
  HUSKY: 0

jobs:
  install:
    name: Install package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: pplancq/actions/setup-node@b248bd44a83e2d0c9f9334aff7e33771fdd77c76 # v1.1.2
        with:
          use-mise: 'true'

      - name: Check package-lock.json
        run: npm run package:check

      - name: Install package
        run: npm ci

  commitlint:
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'copilot/')
    name: CommitLint
    needs:
      - install
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: pplancq/actions/setup-node@b248bd44a83e2d0c9f9334aff7e33771fdd77c76 # v1.1.2
        with:
          use-mise: 'true'

      # https://commitlint.js.org/guides/ci-setup.html#github-actions
      - name: Validate PR commits with commitlint
        run: npx commitlint --from ${{ github.event.pull_request.head.sha }}~${{ github.event.pull_request.commits }} --to ${{ github.event.pull_request.head.sha }} --verbose --color

  lint:
    name: Lint code
    needs:
      - install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: pplancq/actions/setup-node@b248bd44a83e2d0c9f9334aff7e33771fdd77c76 # v1.1.2
        with:
          use-mise: 'true'

      - name: Run lint
        run: npm run lint -- -- --max-processes 1

  chromatic:
    name: Chromatic
    needs:
      - install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
        env:
          CHROMATIC_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          CHROMATIC_SHA: ${{ github.event.pull_request.head.sha || github.ref }}
          CHROMATIC_SLUG: ${{ github.repository }}

      - name: Setup Node
        uses: pplancq/actions/setup-node@b248bd44a83e2d0c9f9334aff7e33771fdd77c76 # v1.1.2
        with:
          use-mise: 'true'

      - name: Build package
        run: npm run build --workspace=@pplancq/shelter-ui-react --workspace=@pplancq/shelter-ui-css

      - name: Run Chromatic
        uses: chromaui/action@14cfaef73576e69f95f47f60058063f46ca38719 # v18.1.0
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          buildScriptName: 'build'
          workingDir: 'apps/storybook'
          onlyChanged: true
          zip: true
          skip: '@(renovate/**|dependabot/**)'

  test:
    name: Test
    needs:
      - install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: pplancq/actions/setup-node@b248bd44a83e2d0c9f9334aff7e33771fdd77c76 # v1.1.2
        with:
          use-mise: 'true'

      - name: Run test
        run: npm run test

      - name: Upload sonar reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sonar-reports
          path: |
            coverage/lcov.info
            sonar-report.xml

  test-browser-visual:
    name: Visual Regression Tests
    needs:
      - install
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node
        uses: pplancq/actions/setup-node@8f236c363bc3d53023c5386a510c3532959554e1 # v1.0.2
        with:
          use-mise: 'true'

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build CSS package
        run: npm run build --workspace=@pplancq/shelter-ui-css

      - name: Run visual regression tests
        id: visual-tests
        run: npm run test:visual --workspace=packages/react
        continue-on-error: true

      - name: Upload screenshot artifacts
        if: steps.visual-tests.outcome == 'failure'
        id: upload-screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visual-regression-screenshots
          path: |
            packages/react/tests/visual/**/__screenshots__/**
            packages/react/.vitest-attachments/**
          if-no-files-found: ignore

      - name: Comment on PR about visual regression failure
        if: steps.visual-tests.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          ARTIFACT_URL: ${{ steps.upload-screenshots.outputs.artifact-url }}
        with:
          script: |
            const artifactUrl = process.env.ARTIFACT_URL;
            const artifactSection = artifactUrl
              ? `\n\n📦 **[Download screenshot artifacts](${artifactUrl})** to compare actual vs. reference screenshots.`
              : '';

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                '## ⚠️ Visual Regression Tests Failed',
                artifactSection,
                '',
                'The visual regression tests failed on this PR. This may indicate:',
                '',
                '- 🔴 **Visual regression** — a UI component has changed unexpectedly.',
                '- 🆕 **New reference screenshots needed** — Linux reference screenshots have not been committed yet for this environment.',
                '',
                '### Next steps',
                '',
                '**If the visual changes are intentional**, update the reference screenshots to match the Linux CI environment using Docker:',
                '```bash',
                'docker run --rm \\',
                '  -v $(pwd):/app -w /app \\',
                '  mcr.microsoft.com/playwright:v1.59.1-jammy \\',
                '  npm run test:visual --workspace=packages/react -- --update',
                '```',
                'Then commit the updated files under `packages/react/tests/visual/**/__screenshots__/`.',
                '',
                '**If the visual changes are unintentional**, investigate and fix the regression before merging.',
              ].filter(Boolean).join('\n'),
            });

      - name: Fail job if visual tests failed
        if: steps.visual-tests.outcome == 'failure'
        run: exit 1

  sonarcloud:
    name: SonarCloud Scan
    needs:
      - test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Download test reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sonar-reports

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build:
    name: Build
    needs:
      - install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: pplancq/actions/setup-node@b248bd44a83e2d0c9f9334aff7e33771fdd77c76 # v1.1.2
        with:
          use-mise: 'true'

      - name: Run build
        run: npm run build
